[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ====================================================================
# Legacy URL redirects (from the old Duda site)
# These URLs had real Google impressions before the rebuild — keep them
# pointing somewhere useful so we don't lose ranking signals.
# ====================================================================

[[redirects]]
  from = "/digital-marketing-in-apple-valley"
  to = "/service-areas/apple-valley"
  status = 301
  force = true

[[redirects]]
  from = "/digital-marketing-in-victorville"
  to = "/service-areas/victorville"
  status = 301
  force = true

[[redirects]]
  from = "/digital-marketing-in-hesperia"
  to = "/service-areas/hesperia"
  status = 301
  force = true

[[redirects]]
  from = "/digital-marketing-in-barstow"
  to = "/service-areas/barstow"
  status = 301
  force = true

[[redirects]]
  from = "/digital-marketing-in-lucerne-valley"
  to = "/service-areas/lucerne-valley"
  status = 301
  force = true

[[redirects]]
  from = "/digital-marketing-in-adelanto"
  to = "/service-areas/adelanto"
  status = 301
  force = true

[[redirects]]
  from = "/about-us"
  to = "/about"
  status = 301
  force = true

# ====================================================================
# Internal URL restructure: location pages moved from /services to /service-areas
# (These are for the brief window where the new site used /services/[city];
# kept in case any external link picked them up.)
# ====================================================================

[[redirects]]
  from = "/services/apple-valley"
  to = "/service-areas/apple-valley"
  status = 301
  force = true

[[redirects]]
  from = "/services/victorville"
  to = "/service-areas/victorville"
  status = 301
  force = true

[[redirects]]
  from = "/services/hesperia"
  to = "/service-areas/hesperia"
  status = 301
  force = true

[[redirects]]
  from = "/services/barstow"
  to = "/service-areas/barstow"
  status = 301
  force = true

[[redirects]]
  from = "/services/lucerne-valley"
  to = "/service-areas/lucerne-valley"
  status = 301
  force = true

[[redirects]]
  from = "/services/adelanto"
  to = "/service-areas/adelanto"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
